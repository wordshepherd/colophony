name: Secret Scan

# Runs on every branch, not just main. ci.yml only triggers on pull_request/push to
# main, so a feature branch pushed without an open PR previously ran no checks at all.
# The pre-commit hook is bypassable with `git commit --no-verify`; this is the gate
# that is not.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Same script the pre-commit hook runs — one implementation, two call sites.
      # --tracked scans the whole tree rather than a diff, so secrets committed
      # earlier on the branch are caught, not just the most recent change.
      - name: Scan tracked files for secrets
        run: sh scripts/check-secrets.sh --tracked
